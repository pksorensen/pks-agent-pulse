name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "Release an exact version (for the first release or recovery)"
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write
  packages: write
  id-token: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.manual.outputs.release_created || steps.release.outputs.release_created }}
      version: ${{ steps.manual.outputs.version || steps.release.outputs.version }}
      tag_name: ${{ steps.manual.outputs.tag_name || steps.release.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'workflow_dispatch' && inputs.version != ''
      - name: Create requested release
        id: manual
        if: github.event_name == 'workflow_dispatch' && inputs.version != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          TAG="v${VERSION}"
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --target main --title "$TAG" --generate-notes
          echo "release_created=true" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag_name=$TAG" >> "$GITHUB_OUTPUT"
      - uses: googleapis/release-please-action@v4
        id: release
        if: github.event_name != 'workflow_dispatch' || inputs.version == ''
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build-push:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: [self-hosted, devcontainer-runner]
    env:
      VERSION: ${{ needs.release-please.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: go.mod
      - name: Install ko
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin"
          GOBIN="$RUNNER_TEMP/bin" go install github.com/google/ko@v0.18.0
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Configure registry credentials
        run: |
          set -euo pipefail
          registry=registry.agentics.dk
          socket=${PKS_TOKEN_URL:-/var/run/pks-creds/creds.sock}
          response=$(curl -fsS --unix-socket "$socket" \
            -H "Authorization: Bearer ${PKS_TOKEN}" \
            "http://localhost/registry/credential?hostname=${registry}")
          username=$(jq -r .username <<<"$response")
          password=$(jq -r .password <<<"$response")
          test -n "$username" && test "$username" != null
          test -n "$password" && test "$password" != null
          echo "::add-mask::$username"
          echo "::add-mask::$password"
          auth=$(printf '%s:%s' "$username" "$password" | base64 | tr -d '\n')
          mkdir -p "$HOME/.docker"
          jq -n --arg auth "$auth" \
            '{auths:{"registry.agentics.dk":{auth:$auth}}}' > "$HOME/.docker/config.json"
      - name: Build and publish multi-platform image
        env:
          KO_DOCKER_REPO: registry.agentics.dk/agentics/pks-agent-pulse
        run: |
          set -euo pipefail
          ko build --bare --platform=linux/amd64,linux/arm64 \
            --tags "$VERSION",latest --sbom=spdx ./cmd/server
      - name: Remove registry credentials
        if: always()
        run: rm -f "$HOME/.docker/config.json"

  publish-cli-skill-docs:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.release-please.outputs.version }}
      TAG: ${{ needs.release-please.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: go.mod
      - name: Build all platforms and skill package
        run: |
          set -euo pipefail
          mkdir -p dist
          for t in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os=${t%/*}; arch=${t#*/}
            name="pulse_${os}_${arch}"
            [ "$os" = windows ] && name="${name}.exe"
            GOOS=$os GOARCH=$arch CGO_ENABLED=0 go build -trimpath \
              -ldflags "-s -w -X main.version=${VERSION}" -o "dist/${name}" .
          done
          ( cd claude-plugin && zip -qr "../dist/pulse-report-skill_${VERSION}.zip" . )
          ( cd dist && sha256sum pulse_* > "pulse_${VERSION}_checksums.txt" )
      - name: Attach release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$TAG" dist/* --repo "${{ github.repository }}" --clobber
      - name: Mint release and docs identities
        run: |
          set -euo pipefail
          curl -fsS -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https://agentics.dk/releases" | jq -r .value > release.oidc
          curl -fsS -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https://agentics.dk/docs" | jq -r .value > docs.oidc
      - name: Publish CLI to agentics.dk
        run: |
          set -euo pipefail
          OIDC=$(cat release.oidc)
          REC="pulse-${VERSION}"
          curl -fsS -X POST -H "Authorization: Bearer ${OIDC}" -H "Content-Type: application/json" \
            -d "{\"component\":\"pulse\",\"semver\":\"${VERSION}\",\"tagName\":\"${TAG}\"}" \
            https://agentics.dk/api/releases >/dev/null
          for f in dist/*; do
            curl -fsS -X PUT -H "Authorization: Bearer ${OIDC}" --data-binary @"$f" \
              "https://agentics.dk/api/releases/${REC}/attachments/$(basename "$f")" >/dev/null
          done
          curl -fsS -X PUT -H "Authorization: Bearer ${OIDC}" \
            "https://agentics.dk/api/releases/${REC}/publish" >/dev/null
      - name: Publish tool docs to agentics.dk
        run: |
          set -euo pipefail
          OIDC=$(cat docs.oidc)
          FILES='[]'
          while IFS= read -r -d '' f; do
            rel=${f#".agentics/tool/"}
            FILES=$(jq --arg p "$rel" --rawfile c "$f" '. + [{path:$p, content:$c}]' <<<"$FILES")
          done < <(find .agentics/tool -name '*.md' -print0)
          jq -n --arg component pulse --arg version "$VERSION" --argjson files "$FILES" \
            '{component:$component, version:$version, files:$files}' > docs-payload.json
          status=$(curl -sS -o docs-response.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer ${OIDC}" -H "Content-Type: application/json" \
            --data-binary @docs-payload.json https://agentics.dk/api/tools/docs)
          if [[ "$status" != 2* && "$status" != 409 ]]; then
            cat docs-response.json >&2
            exit 1
          fi

  deploy-production:
    needs: [release-please, build-push]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: [self-hosted, devcontainer-runner, agentics-live-www-devcontainer]
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: pksorensen/pks-cli/.github/actions/coolify-deploy@main
        with:
          app-name: agent-pulse
          environment: production
          github-token: ${{ secrets.GITHUB_TOKEN }}
          version: ${{ needs.release-please.outputs.version }}
          tag-name: ${{ needs.release-please.outputs.tag_name }}
